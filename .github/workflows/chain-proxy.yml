name: 🚀 Chain Proxy Gateway (VLESS + SS)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: chain-proxy-runner
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install base tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip jq python3 python3-pip curl openssh-client

      - name: ⬇️ Download Xray Core
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip -d ./xray
          chmod +x ./xray/xray

      - name: 🔍 Find Fastest Proxy (VLESS or Shadowsocks)
        env:
          SUB_LINK: "https://github.com/Arefgh72/v2ray-proxy-pars-tester-02/raw/main/output/top_500.txt"
        run: |
          echo "📥 Fetching subscription..."
          wget -q -O sub.txt "$SUB_LINK"
          raw=$(cat sub.txt)
          lines=$(echo "$raw" | head -30)
          best_time=9999
          best_url=""
          while IFS= read -r line; do
            if [[ $line == vless://* || $line == ss://* ]]; then
              if [[ $line == vless://* ]]; then
                host=$(echo "$line" | cut -d'@' -f2 | cut -d':' -f1)
                port=$(echo "$line" | cut -d':' -f3 | cut -d'?' -f1)
              elif [[ $line == ss://* ]]; then
                if [[ $line == ss://*@* ]]; then
                  tmp=${line#ss://}
                  hostport=${tmp#*@}
                  host=$(echo "$hostport" | cut -d':' -f1)
                  port=$(echo "$hostport" | cut -d':' -f2 | cut -d'#' -f1 | cut -d'?' -f1)
                else
                  enc=${line#ss://}
                  dec=$(echo "$enc" | base64 -d 2>/dev/null)
                  hostport=${dec#*@}
                  host=$(echo "$hostport" | cut -d':' -f1)
                  port=$(echo "$hostport" | cut -d':' -f2)
                fi
              fi
              start=$(date +%s%N)
              timeout 2 bash -c "echo >/dev/tcp/$host/$port" 2>/dev/null
              if [ $? -eq 0 ]; then
                end=$(date +%s%N)
                time_ms=$(( (end - start) / 1000000 ))
                echo "Testing ${host}:${port} → ${time_ms}ms"
                if [ $time_ms -lt $best_time ]; then
                  best_time=$time_ms
                  best_url="$line"
                fi
              else
                echo "Testing ${host}:${port} → FAIL"
              fi
            fi
          done <<< "$lines"

          if [ -z "$best_url" ]; then
            echo "❌ No working proxy found."
            exit 1
          fi

          echo "✅ FASTEST PROXY:"
          echo "$best_url"
          echo "PROXY_URL=$best_url" >> $GITHUB_ENV

      - name: ⚙️ Generate Xray config (using Python)
        env:
          PROXY_URL: ${{ env.PROXY_URL }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, sys

          url = os.environ.get("PROXY_URL", "")
          if not url:
              print("No proxy URL")
              sys.exit(1)

          config = {
              "inbounds": [{
                  "port": 10808,
                  "listen": "127.0.0.1",
                  "protocol": "socks",
                  "settings": {"udp": True}
              }],
              "outbounds": []
          }

          if url.startswith("vless://"):
              rest = url[8:]
              uuid = rest.split('@')[0]
              host_port = rest.split('@')[1]
              host = host_port.split(':')[0]
              port = int(host_port.split(':')[1].split('?')[0])
              print(f"Type: VLESS\nUUID: {uuid}\nServer: {host}:{port}")
              config["outbounds"].append({
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": host,
                          "port": port,
                          "users": [{"id": uuid, "encryption": "none"}]
                      }]
                  },
                  "streamSettings": {
                      "network": "ws",
                      "security": "tls"
                  }
              })
          elif url.startswith("ss://"):
              if '@' in url[5:]:
                  tmp = url[5:]
                  userinfo, host_part = tmp.split('@', 1)
                  try:
                      dec = base64.b64decode(userinfo).decode()
                      if ':' in dec:
                          method, password = dec.split(':', 1)
                      else:
                          raise ValueError("No colon")
                  except:
                      if ':' in userinfo:
                          method, password = userinfo.split(':', 1)
                      else:
                          print("Cannot parse userinfo")
                          sys.exit(1)
                  host = host_part.split(':')[0]
                  port = int(host_part.split(':')[1].split('#')[0].split('?')[0])
                  print(f"Type: Shadowsocks\nMethod: {method}\nServer: {host}:{port}")
                  config["outbounds"].append({
                      "protocol": "shadowsocks",
                      "settings": {
                          "servers": [{
                              "address": host,
                              "port": port,
                              "method": method,
                              "password": password
                          }]
                      }
                  })
              else:
                  enc = url[5:]
                  dec = base64.b64decode(enc).decode()
                  method, rest = dec.split(':', 1)
                  password, host_port = rest.split('@', 1)
                  host = host_port.split(':')[0]
                  port = int(host_port.split(':')[1])
                  print(f"Type: Shadowsocks\nMethod: {method}\nServer: {host}:{port}")
                  config["outbounds"].append({
                      "protocol": "shadowsocks",
                      "settings": {
                          "servers": [{
                              "address": host,
                              "port": port,
                              "method": method,
                              "password": password
                          }]
                      }
                  })
          else:
              print("Unsupported protocol")
              sys.exit(1)

          with open("./xray/config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("📄 Xray config created.")
          PYEOF

      - name: 🚀 Start Xray Core
        run: |
          ./xray/xray -c ./xray/config.json &
          sleep 3

      - name: 🐍 Start Python relay (listening on all interfaces)
        run: |
          echo "📦 Installing PySocks..."
          pip3 install --user pysocks flask requests
          python3 -c "import socks"
          echo "✅ PySocks ready."

          echo "🧪 Quick SOCKS5 test..."
          if curl -s --max-time 5 --socks5 127.0.0.1:10808 http://example.com >/dev/null; then
            echo "✅ SOCKS5 test passed."
          else
            echo "❌ SOCKS5 test failed, but continuing..."
          fi

          cat > relay.py << 'PYEOF'
          import sys, json, requests
          from flask import Flask, request, Response

          app = Flask(__name__)
          SOCKS_PROXY = "socks5h://127.0.0.1:10808"

          @app.route('/', methods=['POST'])
          def relay():
              data = request.get_json()
              if not data:
                  return {"e": "invalid json"}, 400
              real_url = data.get('u')
              method = data.get('m', 'GET').upper()
              headers = data.get('h', {})
              body = data.get('b', None)
              proxies = dict(http=SOCKS_PROXY, https=SOCKS_PROXY)
              try:
                  if method == 'GET':
                      resp = requests.get(real_url, headers=headers, proxies=proxies, timeout=30)
                  else:
                      resp = requests.request(method, real_url, headers=headers, data=body, proxies=proxies, timeout=30)
                  return Response(resp.content, status=resp.status_code, headers=dict(resp.headers))
              except Exception as e:
                  print(f"Relay ERROR for {real_url}: {e}", file=sys.stderr)
                  return {"e": str(e)}, 502

          if __name__ == '__main__':
              import os
              port = int(os.environ.get("PORT", 8080))
              app.run(host='0.0.0.0', port=port, debug=False)
          PYEOF

          python3 -u relay.py >> relay.log 2>&1 &
          RELAY_PID=$!
          sleep 3
          if kill -0 $RELAY_PID 2>/dev/null; then
            echo "✅ Relay running (PID $RELAY_PID)."
          else
            echo "❌ Relay failed to start!"
            cat relay.log
            exit 1
          fi

      - name: 🌐 Start Localhost.run Tunnel + Auto-Reconnect
        run: |
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N "" -q
          echo "✅ SSH key generated"

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          while true; do
            echo "🔁 Starting localhost.run tunnel..."
            SSH_CMD="ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:127.0.0.1:8080 nokey@localhost.run"
            $SSH_CMD 2>&1 | while read line; do
              echo "$line"
              # الگوی آدرس: https://xxxxxxxxxxxxx.lhr.life
              if echo "$line" | grep -q 'https://.*\.lhr\.life'; then
                HOST_ADDR=$(echo "$line" | grep -oP 'https://\K[^ ]+\.lhr\.life')
                echo "🌎 Public host: $HOST_ADDR"
                
                # به‌روزرسانی فایل tunnel.txt و push
                echo "$HOST_ADDR" > tunnel.txt
                git add tunnel.txt
                git commit -m "Update tunnel address" || true
                git push origin main || true
                
                curl -d "$HOST_ADDR" https://ntfy.sh/arefgh_dccoop_tunnel_7x9k
                echo "✅ Host address pushed to repo (and sent to ntfy)"
              fi
            done &
            SSH_PID=$!
            sleep 3300  # ۵۵ دقیقه (تونل localhost.run زمان‌بندی نامحدود داره، ولی ما هر ۵۵ دقیقه تمدید می‌کنیم)
            kill $SSH_PID 2>/dev/null
            sleep 2
          done &

      - name: 📋 Dump Relay Log (after a short wait)
        run: |
          echo "⏳ Waiting 30 seconds for some requests to arrive..."
          sleep 30
          echo "📄 Relay log contents:"
          cat relay.log || echo "(no log yet)"

      - name: ⏳ Keep Alive (6h max)
        run: |
          echo "🟢 TUNNEL ACTIVE — will shutdown after 6 hours."
          while true; do sleep 60; done
