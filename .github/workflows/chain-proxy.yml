name: 🚀 Chain Proxy Gateway (WS Relay)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: chain-proxy-runner
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install base tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip jq python3 python3-pip curl nodejs npm

      - name: ⬇️ Download Xray Core
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip -d ./xray
          chmod +x ./xray/xray

      - name: 🔍 Find Fastest Proxy (VLESS or Shadowsocks)
        env:
          SUB_LINK: "https://github.com/Arefgh72/v2ray-proxy-pars-tester-02/raw/main/output/top_500.txt"
        run: |
          echo "📥 Fetching subscription..."
          wget -q -O sub.txt "$SUB_LINK"
          raw=$(cat sub.txt)
          lines=$(echo "$raw" | head -30)
          best_time=9999
          best_url=""
          while IFS= read -r line; do
            if [[ $line == vless://* || $line == ss://* ]]; then
              if [[ $line == vless://* ]]; then
                host=$(echo "$line" | cut -d'@' -f2 | cut -d':' -f1)
                port=$(echo "$line" | cut -d':' -f3 | cut -d'?' -f1)
              elif [[ $line == ss://* ]]; then
                if [[ $line == ss://*@* ]]; then
                  tmp=${line#ss://}
                  hostport=${tmp#*@}
                  host=$(echo "$hostport" | cut -d':' -f1)
                  port=$(echo "$hostport" | cut -d':' -f2 | cut -d'#' -f1 | cut -d'?' -f1)
                else
                  enc=${line#ss://}
                  dec=$(echo "$enc" | base64 -d 2>/dev/null)
                  hostport=${dec#*@}
                  host=$(echo "$hostport" | cut -d':' -f1)
                  port=$(echo "$hostport" | cut -d':' -f2)
                fi
              fi
              start=$(date +%s%N)
              timeout 2 bash -c "echo >/dev/tcp/$host/$port" 2>/dev/null
              if [ $? -eq 0 ]; then
                end=$(date +%s%N)
                time_ms=$(( (end - start) / 1000000 ))
                echo "Testing ${host}:${port} → ${time_ms}ms"
                if [ $time_ms -lt $best_time ]; then
                  best_time=$time_ms
                  best_url="$line"
                fi
              else
                echo "Testing ${host}:${port} → FAIL"
              fi
            fi
          done <<< "$lines"

          if [ -z "$best_url" ]; then
            echo "❌ No working proxy found."
            exit 1
          fi

          echo "✅ FASTEST PROXY:"
          echo "$best_url"
          echo "PROXY_URL=$best_url" >> $GITHUB_ENV

      - name: ⚙️ Generate Xray config (using Python)
        env:
          PROXY_URL: ${{ env.PROXY_URL }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, sys
          url = os.environ.get("PROXY_URL", "")
          if not url: sys.exit(1)
          config = {
            "inbounds": [{"port": 10808, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}}],
            "outbounds": []
          }
          if url.startswith("vless://"):
            rest = url[8:]
            uuid = rest.split('@')[0]
            host_port = rest.split('@')[1]
            host = host_port.split(':')[0]
            port = int(host_port.split(':')[1].split('?')[0])
            print(f"VLESS: {host}:{port}")
            config["outbounds"].append({
              "protocol": "vless",
              "settings": {"vnext": [{"address": host, "port": port, "users": [{"id": uuid, "encryption": "none"}]}]},
              "streamSettings": {"network": "ws", "security": "tls"}
            })
          elif url.startswith("ss://"):
            if '@' in url[5:]:
              tmp = url[5:]
              userinfo, host_part = tmp.split('@', 1)
              try:
                dec = base64.b64decode(userinfo).decode()
                if ':' in dec: method, password = dec.split(':', 1)
                else: raise ValueError
              except:
                if ':' in userinfo: method, password = userinfo.split(':', 1)
                else: sys.exit(1)
              host = host_part.split(':')[0]
              port = int(host_part.split(':')[1].split('#')[0].split('?')[0])
            else:
              enc = url[5:]
              dec = base64.b64decode(enc).decode()
              method, rest = dec.split(':', 1)
              password, host_port = rest.split('@', 1)
              host = host_port.split(':')[0]
              port = int(host_port.split(':')[1])
            print(f"Shadowsocks: {host}:{port}")
            config["outbounds"].append({
              "protocol": "shadowsocks",
              "settings": {"servers": [{"address": host, "port": port, "method": method, "password": password}]}
            })
          else:
            sys.exit(1)
          with open("./xray/config.json", "w") as f:
            json.dump(config, f, indent=2)
          PYEOF

      - name: 🚀 Start Xray Core
        run: |
          ./xray/xray -c ./xray/config.json &
          sleep 3

      - name: 📡 Start Node.js relay (WebSocket to Worker)
        run: |
          cd $GITHUB_WORKSPACE
          npm init -y
          npm install ws socks-proxy-agent node-fetch

          cat > connect-worker.js << 'NODEEOF'
          const WebSocket = require('ws');
          const fetch = require('node-fetch');
          const { SocksProxyAgent } = require('socks-proxy-agent');

          const WORKER_URL = 'ws://wild-paper-0725.aref-gha.workers.dev/ws';
          const SOCKS_PROXY = 'socks5://127.0.0.1:10808';

          const agent = new SocksProxyAgent(SOCKS_PROXY);

          function connect() {
            const ws = new WebSocket(WORKER_URL);
            ws.on('open', () => console.log('Connected to Worker'));
            ws.on('message', async (data) => {
              try {
                const req = JSON.parse(data);
                const fetchOptions = {
                  method: req.m,
                  headers: req.h,
                  agent: req.u.startsWith('https') ? agent : undefined,
                };
                if (req.b && req.m !== 'GET') {
                  fetchOptions.body = req.b;
                }
                // حذف هدرهایی که node-fetch خودکار می‌سازد
                if (req.h['host']) delete req.h['host'];
                if (req.h['content-length']) delete req.h['content-length'];

                const response = await fetch(req.u, fetchOptions);
                const body = await response.text();
                const respData = {
                  status: response.status,
                  headers: Object.fromEntries(response.headers.entries()),
                  body: body
                };
                ws.send(JSON.stringify(respData));
              } catch (err) {
                ws.send(JSON.stringify({ status: 502, body: err.message }));
              }
            });
            ws.on('close', () => {
              console.log('Disconnected, retrying in 5s...');
              setTimeout(connect, 5000);
            });
            ws.on('error', (err) => {
              console.error('WebSocket error:', err.message);
              ws.close();
            });
          }

          connect();
          // نگه‌داشتن پردازه
          setInterval(() => {}, 10000);
          NODEEOF

          node connect-worker.js &
          echo "✅ Node.js relay started"

      - name: ⏳ Keep Alive (6h max)
        run: |
          echo "🟢 TUNNEL ACTIVE — will shutdown after 6 hours."
          while true; do sleep 60; done
